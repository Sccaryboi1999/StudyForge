name: Feature request
description: Suggest an improvement to StudyForge
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What student or maintainer need would this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the workflow and expected result.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or other approaches.
  - type: checkboxes
    id: principles
    attributes:
      label: Project principles
      options:
        - label: The guest workflow should remain usable without paid external services.
        - label: Source fidelity and privacy implications have been considered.
